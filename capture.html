<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل سلعة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; direction: rtl; position: relative; overflow-x: hidden; }
.bg-blobs { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.bg-blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.32; will-change: transform; }
.bg-blob-1 { width: 420px; height: 420px; background: #38bdf8; top: -120px; right: -100px; animation: blobFloat1 20s ease-in-out infinite; }
.bg-blob-2 { width: 380px; height: 380px; background: #22c55e; bottom: -140px; left: -110px; animation: blobFloat2 24s ease-in-out infinite; }
.bg-blob-3 { width: 320px; height: 320px; background: #a78bfa; top: 45%; left: 55%; animation: blobFloat3 28s ease-in-out infinite; }
@keyframes blobFloat1 { 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(-50px,70px) scale(1.15);} }
@keyframes blobFloat2 { 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(60px,-50px) scale(1.1);} }
@keyframes blobFloat3 { 0%,100%{transform:translate(-50%,-50%) scale(1);} 50%{transform:translate(-55%,-45%) scale(1.2);} }
@keyframes fadeSlideIn { from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
@keyframes popIn { from{opacity:0; transform:scale(0.93);} to{opacity:1; transform:scale(1);} }
@media (prefers-reduced-motion: reduce) {
  .bg-blob { animation: none; }
  .card, .toast.show { animation: none !important; }
}
.app { max-width: 960px; margin: 0 auto; padding: 20px; }
h1 { text-align: center; font-size: 24px; font-weight: 800; padding: 24px 0; background: linear-gradient(135deg, #38bdf8, #a78bfa); -webkit-background-clip: text; background-clip: text; color: transparent; border-bottom: 2px solid #1e293b; margin-bottom: 24px; }
.home-link { display: block; text-align: center; color: #64748b; font-size: 13px; margin-top: -14px; margin-bottom: 24px; text-decoration: none; }
.home-link:hover { color: #38bdf8; }
.home-grid { display: flex; flex-direction: column; gap: 16px; margin-bottom: 20px; }
.home-btn { display: flex; align-items: center; gap: 18px; padding: 24px 22px; border: none; border-radius: 16px; cursor: pointer; font-family: inherit; color: #fff; text-align: right; box-shadow: 0 4px 14px rgba(0,0,0,0.25); transition: transform 0.2s ease, box-shadow 0.2s ease; font-size: inherit; }
.home-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 26px rgba(0,0,0,0.35); }
.home-btn:active { transform: scale(0.97); }
.home-btn-icon { font-size: 34px; flex-shrink: 0; }
.home-btn-label { font-size: 18px; font-weight: 700; }
.home-btn-sub { font-size: 12px; font-weight: 500; opacity: 0.85; margin-top: 2px; }
.mcolor-0 { background: linear-gradient(135deg, #38bdf8, #0ea5e9); }
.mcolor-1 { background: linear-gradient(135deg, #22c55e, #16a34a); }
.mcolor-2 { background: linear-gradient(135deg, #f59e0b, #d97706); }
.mcolor-3 { background: linear-gradient(135deg, #a78bfa, #7c3aed); }
.mcolor-4 { background: linear-gradient(135deg, #f472b6, #db2777); }
.mcolor-5 { background: linear-gradient(135deg, #2dd4bf, #0d9488); }
.back-btn { background: none; border: none; color: #38bdf8; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; padding: 8px 0 18px; display: flex; align-items: center; gap: 6px; }
.back-btn:hover { text-decoration: underline; }
.card { background: rgba(30,41,59,0.92); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); border-radius: 14px; padding: 24px; margin-bottom: 20px; border: 1px solid #334155; box-shadow: 0 8px 28px rgba(0,0,0,0.28); animation: fadeSlideIn 0.4s ease; }
.card h2 { font-size: 18px; margin-bottom: 16px; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
.shop-badge { display: inline-flex; align-items: center; gap: 6px; background: #0f172a; border: 1px solid #334155; color: #94a3b8; font-size: 13px; padding: 8px 12px; border-radius: 10px; margin-bottom: 16px; }
.form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
label { font-size: 14px; color: #94a3b8; }
input, select, textarea { padding: 12px 14px; background: #0f172a; border: 2px solid #334155; border-radius: 10px; color: #e2e8f0; font-size: 15px; font-family: inherit; outline: none; transition: border-color 0.2s; width: 100%; }
input:focus, select:focus, textarea:focus { border-color: #38bdf8; }
select { cursor: pointer; }
option { background: #0f172a; }
textarea { resize: vertical; min-height: 70px; }
.btn { padding: 12px 24px; border: none; border-radius: 10px; font-size: 15px; font-family: inherit; cursor: pointer; transition: all 0.2s; font-weight: 600; }
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: scale(0.96); }
.btn-primary { background: #38bdf8; color: #0f172a; }
.btn-primary:hover { background: #7dd3fc; }
.btn-secondary { background: #475569; color: #e2e8f0; }
.btn-secondary:hover { background: #64748b; }
.btn-success { background: #22c55e; color: #fff; width: 100%; font-size: 17px; padding: 16px 24px; }
.btn-success:hover { background: #4ade80; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
.new-section-btn { background: transparent; border: 2px dashed #475569; color: #94a3b8; width: 100%; padding: 12px; border-radius: 10px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; transition: border-color 0.2s, color 0.2s; margin-top: 10px; }
.new-section-btn:hover { border-color: #38bdf8; color: #38bdf8; }
.new-section-form { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px dashed #334155; }
.new-section-form.show { display: block; }
.img-upload-area { border: 2px dashed #475569; border-radius: 12px; padding: 16px; text-align: center; cursor: pointer; transition: border-color 0.2s; }
.img-upload-area:hover { border-color: #38bdf8; }
.img-upload-area img { max-width: 100%; max-height: 160px; border-radius: 8px; object-fit: contain; }
.img-upload-area .upload-text { color: #64748b; font-size: 14px; }
.img-remove-btn { display: inline-block; margin-top: 8px; padding: 4px 12px; background: #ef4444; color: #fff; border: none; border-radius: 6px; font-size: 12px; cursor: pointer; font-family: inherit; }
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px); background: #22c55e; color: #fff; padding: 14px 28px; border-radius: 12px; font-size: 15px; font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,0.35); transition: transform 0.4s cubic-bezier(.34,1.56,.64,1); z-index: 200; }
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.error { background: #ef4444; }
.auth-gate { position: fixed; inset: 0; background: rgba(15,23,42,0.88); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); z-index: 500; display: flex; align-items: center; justify-content: center; padding: 20px; }
.auth-box { background: rgba(30,41,59,0.95); backdrop-filter: blur(6px); border: 1px solid #334155; border-radius: 16px; padding: 32px 28px; width: 100%; max-width: 340px; text-align: center; box-shadow: 0 16px 48px rgba(0,0,0,0.5); animation: popIn 0.35s ease; }
.auth-icon { font-size: 40px; margin-bottom: 12px; }
.auth-box h2 { color: #38bdf8; font-size: 20px; margin-bottom: 20px; }
.auth-box input { width: 100%; text-align: center; letter-spacing: 4px; font-size: 20px; margin-bottom: 14px; }
.auth-box .btn { width: 100%; }
.auth-error { color: #ef4444; font-size: 13px; margin-top: 12px; display: none; }
.auth-error.show { display: block; }
.auth-shake { animation: authShake 0.35s; }
@keyframes authShake { 10%,90%{transform:translateX(-2px)} 20%,80%{transform:translateX(4px)} 30%,50%,70%{transform:translateX(-8px)} 40%,60%{transform:translateX(8px)} }
</style>
</head>
<body>
<div class="bg-blobs" aria-hidden="true"><div class="bg-blob bg-blob-1"></div><div class="bg-blob bg-blob-2"></div><div class="bg-blob bg-blob-3"></div></div>
<div class="auth-gate" id="authGate">
  <div class="auth-box" id="authBox">
    <div class="auth-icon">&#128274;</div>
    <h2>الدخول محمي</h2>
    <input type="password" id="authInput" inputmode="numeric" autocomplete="off" placeholder="الرقم السري">
    <button class="btn btn-primary" onclick="checkAuth()">دخول</button>
    <div class="auth-error" id="authError">الرقم السري غير صحيح</div>
  </div>
</div>

<div class="app" id="appRoot" style="display:none;">
  <h1>&#128248; تسجيل سلعة</h1>
  <a class="home-link" href="index.html">&#8592; الموقع الرئيسي</a>

  <!-- Landing: choose flow -->
  <div id="landingView">
    <div class="card">
      <h2>وش تبي تسوي؟</h2>
      <div class="home-grid">
        <button class="home-btn mcolor-0" onclick="startFieldFlow()"><span class="home-btn-icon">&#128205;</span><span><span class="home-btn-label">جمع بيانات ميدانية</span><br><span class="home-btn-sub">تصوير سلع من محل حقيقي</span></span></button>
        <button class="home-btn mcolor-3" onclick="startWebFlow()"><span class="home-btn-icon">&#127760;</span><span><span class="home-btn-label">جمع بيانات من المواقع</span><br><span class="home-btn-sub">سلعة من موقع إلكتروني</span></span></button>
      </div>
    </div>
  </div>

  <!-- Field flow: enter shop name first -->
  <div id="fieldShopView" style="display:none;">
    <button class="back-btn" onclick="backToLanding()">&#8592; رجوع</button>
    <div class="card">
      <h2>&#128205; جمع بيانات ميدانية</h2>
      <div class="form-group"><label>اسم المحل</label><input type="text" id="shopNameInput" placeholder="مثال: محل الحرفي"></div>
      <button class="btn btn-success" onclick="continueFieldFlow()">متابعة</button>
    </div>
  </div>

  <!-- Shared: pick section + item form -->
  <div id="collectView" style="display:none;">
    <button class="back-btn" onclick="backFromCollect()">&#8592; رجوع</button>

    <div class="card">
      <h2>&#128193; اختر القسم</h2>
      <div class="form-group">
        <select id="sectionSelect" onchange="onSectionChange()"><option value="">-- اختر القسم --</option></select>
      </div>
      <button class="new-section-btn" onclick="toggleNewSectionForm()">&#10133; إنشاء قسم جديد</button>
      <div class="new-section-form" id="newSectionForm">
        <div class="form-group"><label>اسم القسم</label><input type="text" id="newSectionName" placeholder="مثال: الجزئيات"></div>
        <div class="btn-row"><button class="btn btn-primary" onclick="saveNewSection()">حفظ القسم</button><button class="btn btn-secondary" onclick="toggleNewSectionForm()">إلغاء</button></div>
      </div>
    </div>

    <div class="card" id="itemFormCard" style="display:none;">
      <h2 id="itemFormTitle"></h2>
      <div class="shop-badge" id="shopNameDisplay" style="display:none;"></div>
      <div class="form-group" id="qaLinkGroup"><label>رابط المنتج (اختياري)</label><div style="display:flex;gap:8px;"><input type="url" id="qaLink" placeholder="https://..." dir="ltr" style="flex:1;"><button type="button" class="btn btn-secondary" onclick="openQaLink()" style="flex-shrink:0;white-space:nowrap;">&#128279; فتح</button></div></div>
      <div class="form-group"><label>صورة السلعة</label><div class="img-upload-area" onclick="document.getElementById('qaImage').click()"><div class="upload-text" id="qaImgPlaceholder">اضغط للتصوير أو اختيار صورة</div><img id="qaImgPreview" style="display:none;"><input type="file" id="qaImage" accept="image/*" capture="environment" onchange="handleQaImageUpload(event)" style="display:none;"></div><button class="img-remove-btn" id="qaImgRemoveBtn" style="display:none;" onclick="removeQaImage(event)">حذف الصورة</button><input type="hidden" id="qaImageData" value=""></div>
      <div class="form-group"><label>اسم السلعة (اختياري، افتراضيًا اسم القسم)</label><input type="text" id="qaName" placeholder="مثال: قالب سيليكون دائري"></div>
      <div class="form-group"><label>رقم الهاتف</label><input type="tel" id="qaPhone" placeholder="96512345678" dir="ltr"></div>
      <div class="form-group"><label>ملاحظات (اختياري)</label><textarea id="qaNotes" placeholder="أي ملاحظات إضافية..."></textarea></div>
      <button class="btn btn-success" onclick="saveQuickadd()">&#128190; حفظ السلعة</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const AUTH_KEY = 'material_cost_auth';
const AUTH_PIN = '232344';
function unlockApp() {
  document.getElementById('authGate').style.display = 'none';
  document.getElementById('appRoot').style.display = 'block';
}
function checkAuth() {
  const input = document.getElementById('authInput');
  if (input.value === AUTH_PIN) {
    localStorage.setItem(AUTH_KEY, '1');
    unlockApp();
  } else {
    const err = document.getElementById('authError'), box = document.getElementById('authBox');
    err.classList.add('show');
    box.classList.remove('auth-shake'); void box.offsetWidth; box.classList.add('auth-shake');
    input.value = '';
    input.focus();
  }
}
document.getElementById('authInput').addEventListener('keydown', e => { if (e.key === 'Enter') checkAuth(); });
if (localStorage.getItem(AUTH_KEY) === '1') unlockApp();

const STORAGE_KEY = 'material_cost_data';
const FIREBASE_URL = 'https://nawwaf2-66f3c-default-rtdb.firebaseio.com';
function showToast(msg, err) { const t=document.getElementById('toast'); t.textContent=msg; t.className='toast show'+(err?' error':''); setTimeout(()=>t.className='toast',2500); }

let data = null;
let flowMode = null; // 'field' | 'web'
let fieldShopName = '';

function loadLocalData() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) return JSON.parse(saved);
  return { sections: ['الشموع','السيليكون','الفيلمنت'], materials: [], packaging: [], nextId: 1, nextPkgId: 1 };
}

function fetchData() {
  data = loadLocalData();
  populateSectionSelect();
  fetch(FIREBASE_URL + '/material_cost_data.json')
    .then(r => r.json())
    .then(remote => { if (remote) { data = remote; populateSectionSelect(); } })
    .catch(()=>{});
}

function saveData() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e) {}
  fetch(FIREBASE_URL + '/material_cost_data.json', { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(data) }).catch(()=>{});
}

// ── Flow navigation ──
function startFieldFlow(){
  flowMode = 'field';
  document.getElementById('shopNameInput').value = '';
  document.getElementById('landingView').style.display = 'none';
  document.getElementById('fieldShopView').style.display = 'block';
}
function startWebFlow(){
  flowMode = 'web';
  fieldShopName = '';
  document.getElementById('landingView').style.display = 'none';
  showCollectView();
}
function continueFieldFlow(){
  const n = document.getElementById('shopNameInput').value.trim();
  if (!n) { showToast('أدخل اسم المحل', true); return; }
  fieldShopName = n;
  document.getElementById('fieldShopView').style.display = 'none';
  showCollectView();
}
function backToLanding(){
  document.getElementById('fieldShopView').style.display = 'none';
  document.getElementById('collectView').style.display = 'none';
  document.getElementById('landingView').style.display = 'block';
}
function backFromCollect(){
  document.getElementById('collectView').style.display = 'none';
  if (flowMode === 'field') document.getElementById('fieldShopView').style.display = 'block';
  else document.getElementById('landingView').style.display = 'block';
}
function showCollectView(){
  document.getElementById('sectionSelect').value = '';
  document.getElementById('itemFormCard').style.display = 'none';
  document.getElementById('qaLinkGroup').style.display = flowMode === 'web' ? 'block' : 'none';
  const badge = document.getElementById('shopNameDisplay');
  if (flowMode === 'field') { badge.style.display = 'inline-flex'; badge.textContent = '\u{1F4CD} ' + fieldShopName; }
  else badge.style.display = 'none';
  document.getElementById('collectView').style.display = 'block';
}

function populateSectionSelect(){
  const s = document.getElementById('sectionSelect'), prev = s.value;
  s.innerHTML = '<option value="">-- اختر القسم --</option>' + data.sections.map(x => `<option value="${x}">${x}</option>`).join('');
  if (prev && data.sections.includes(prev)) s.value = prev;
}

function onSectionChange(){
  const sec = document.getElementById('sectionSelect').value;
  const card = document.getElementById('itemFormCard');
  if (!sec) { card.style.display = 'none'; return; }
  document.getElementById('itemFormTitle').textContent = sec;
  card.style.display = 'block';
}

function toggleNewSectionForm(){
  const f = document.getElementById('newSectionForm');
  f.classList.toggle('show');
  if (f.classList.contains('show')) { document.getElementById('newSectionName').value=''; document.getElementById('newSectionName').focus(); }
}

function saveNewSection(){
  const n = document.getElementById('newSectionName').value.trim();
  if (!n) { showToast('أدخل اسم القسم', true); return; }
  if (data.sections.includes(n)) { showToast('موجود مسبقاً', true); return; }
  data.sections.push(n);
  saveData();
  populateSectionSelect();
  document.getElementById('sectionSelect').value = n;
  onSectionChange();
  toggleNewSectionForm();
  showToast('تم إضافة القسم');
}

function resizeImage(file,cb){const r=new FileReader();r.onload=function(ev){const img=new Image();img.onload=function(){const c=document.createElement('canvas'),mx=500;let w=img.width,h=img.height;if(w>h){if(w>mx){h=h*mx/w;w=mx;}}else{if(h>mx){w=w*mx/h;h=mx;}}c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);cb(c.toDataURL('image/jpeg',0.75));};img.src=ev.target.result;};r.readAsDataURL(file);}
function setImageUI(dataId,previewId,placeholderId,removeBtnId,dataUrl){document.getElementById(dataId).value=dataUrl;const p=document.getElementById(previewId);p.src=dataUrl;p.style.display='block';document.getElementById(placeholderId).style.display='none';document.getElementById(removeBtnId).style.display='inline-block';}
function clearImageUI(dataId,fileId,previewId,placeholderId,removeBtnId){document.getElementById(dataId).value='';document.getElementById(fileId).value='';document.getElementById(previewId).style.display='none';document.getElementById(placeholderId).style.display='block';document.getElementById(removeBtnId).style.display='none';}
function handleQaImageUpload(e){const f=e.target.files[0];if(!f)return;resizeImage(f,d=>setImageUI('qaImageData','qaImgPreview','qaImgPlaceholder','qaImgRemoveBtn',d));}
function removeQaImage(e){e.stopPropagation();clearImageUI('qaImageData','qaImage','qaImgPreview','qaImgPlaceholder','qaImgRemoveBtn');}
function resetQaImageUI(){clearImageUI('qaImageData','qaImage','qaImgPreview','qaImgPlaceholder','qaImgRemoveBtn');}

function openQaLink(){
  let url = document.getElementById('qaLink').value.trim();
  if(!url){ showToast('أدخل الرابط أولاً', true); return; }
  if(!/^https?:\/\//i.test(url)) url = 'https://' + url;
  window.open(url, '_blank');
}

function saveQuickadd(){
  const sec = document.getElementById('sectionSelect').value;
  if (!sec) { showToast('اختر القسم أولاً', true); return; }
  const n=document.getElementById('qaName').value.trim() || sec;
  let link='';
  if (flowMode === 'web') {
    link = document.getElementById('qaLink').value.trim();
    if(link && !/^https?:\/\//i.test(link)) link = 'https://' + link;
  }
  const place = flowMode === 'field' ? fieldShopName : '';
  const ph=document.getElementById('qaPhone').value.trim(),notes=document.getElementById('qaNotes').value.trim(),img=document.getElementById('qaImageData').value||'';
  data.materials.push({id:data.nextId++,section:sec,name:n,price:0,qty:0,unit:'kg',image:img,phone:ph,website:link,place:place,catalog:'',notes:notes});
  saveData();
  showToast('تم حفظ السلعة');
  document.getElementById('qaName').value='';
  document.getElementById('qaLink').value='';
  document.getElementById('qaPhone').value='';
  document.getElementById('qaNotes').value='';
  resetQaImageUI();
  document.getElementById('qaName').focus();
}

fetchData();
</script>
</body>
</html>
